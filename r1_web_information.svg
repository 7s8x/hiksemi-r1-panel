<svg xmlns="http://www.w3.org/2000/svg" width="376" height="960" viewBox="0 0 376 960">
  <rect width="376" height="960" fill="#0b121b"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
    <!-- Device and system identity -->
    <text x="20" y="35" fill="#edf6f8" font-size="22" font-weight="700">HIKSEMI R1</text>
    <text x="20" y="61" fill="#8fa6b4" font-size="12">{{PVE_VERSION}}</text>
    <text x="20" y="81" fill="#75c4dc" font-size="11">{{UPTIME}}</text>
    <rect x="291" y="13" width="65" height="25" rx="6" fill="#17382f" stroke="#327861" stroke-width="1"/>
    <circle cx="304" cy="25.5" r="4" fill="#71d4b7"/>
    <text x="316" y="30" fill="#9ee8ce" font-size="12" font-weight="600">在线</text>
    <text x="356" y="80" fill="#edf6f8" font-size="37" font-weight="700" text-anchor="end">{{CLOCK}}</text>

    <!-- CPU card -->
    <rect x="16" y="99" width="344" height="167" rx="7" fill="#15232e" stroke="#2a4050"/>
    <text x="32" y="127" fill="#edf6f8" font-size="16" font-weight="700">处理器</text>
    <text x="344" y="126" fill="#9bb1be" font-size="12" text-anchor="end">{{CPU_MODEL}}</text>
    <circle cx="91" cy="198" r="50" fill="none" stroke="#263845" stroke-width="10"/>
    <circle cx="91" cy="198" r="50" fill="none" stroke="#74bfff" stroke-width="10" stroke-linecap="round" stroke-dasharray="{{CPU_ARC}} 314" transform="rotate(-90 91 198)"/>
    <text x="91" y="200" fill="#edf6f8" font-size="29" font-weight="700" text-anchor="middle">{{CPU_USAGE}}</text>
    <text x="91" y="224" fill="#9bb1be" font-size="11" text-anchor="middle">CPU 占用</text>
    <text x="171" y="194" fill="#9bb1be" font-size="12" dominant-baseline="middle">温度</text>
    <text x="329" y="200" fill="#f5ad75" font-size="37" font-weight="700" text-anchor="end">{{CPU_TEMP}}<tspan font-size="17">{{CPU_TEMP_UNIT}}</tspan></text>
    <line x1="158" y1="209" x2="344" y2="209" stroke="#3a5260" stroke-opacity="0.45" stroke-width="1"/>
    <text x="171" y="224" fill="#9bb1be" font-size="12" dominant-baseline="middle">内存</text>
    <text x="329" y="233" fill="#edf6f8" font-size="17" font-weight="700" text-anchor="end">{{MEM_USED}}<tspan fill="#9bb1be"> / {{MEM_TOTAL}}</tspan><tspan fill="#9bb1be" font-size="11"> GiB</tspan></text>

    <!-- Drives: NVMe, then physical bays 1 through 4 -->
    <rect x="16" y="279" width="344" height="510" rx="7" fill="#15232e" stroke="#2a4050"/>
    <text x="32" y="308" fill="#edf6f8" font-size="16" font-weight="700">存储硬盘 ×{{DRIVE_COUNT}}</text>
    <text x="344" y="307" fill="#8fa6b4" font-size="11" text-anchor="end">温度 / 占用</text>

    <text x="42" y="347" fill="#edf6f8" font-size="16" font-weight="700">{{D0_TITLE}}</text>
    <text x="42" y="366" fill="#9ab2c0" font-size="11">{{D0_MODEL}}</text>
    <text x="332" y="366" fill="#75c4dc" font-size="37" font-weight="700" text-anchor="end">{{D0_TEMP}}<tspan font-size="17">{{D0_UNIT}}</tspan></text>
    <rect x="42" y="380" width="290" height="5" rx="2.5" fill="#344b57"/>
    <rect x="42" y="380" width="{{D0_BAR}}" height="5" rx="2.5" fill="{{D0_BAR_COLOR}}"/>
    <text x="42" y="400" fill="#9ab2c0" font-size="11" font-weight="700">{{D0_USED}}</text>
    <text x="332" y="400" fill="#9ab2c0" font-size="11" text-anchor="end">{{D0_TOTAL}}</text>
    <line x1="42" y1="411" x2="332" y2="411" stroke="#3a5260" stroke-opacity="0.45" stroke-width="1"/>

    <text x="42" y="439" fill="#edf6f8" font-size="16" font-weight="700">{{D1_TITLE}}</text>
    <text x="42" y="458" fill="#9ab2c0" font-size="11">{{D1_MODEL}}</text>
    <text x="332" y="458" fill="#75c4dc" font-size="37" font-weight="700" text-anchor="end">{{D1_TEMP}}<tspan font-size="17">{{D1_UNIT}}</tspan></text>
    <rect x="42" y="472" width="290" height="5" rx="2.5" fill="#344b57"/>
    <rect x="42" y="472" width="{{D1_BAR}}" height="5" rx="2.5" fill="{{D1_BAR_COLOR}}"/>
    <text x="42" y="492" fill="#9ab2c0" font-size="11" font-weight="700">{{D1_USED}}</text>
    <text x="332" y="492" fill="#9ab2c0" font-size="11" text-anchor="end">{{D1_TOTAL}}</text>
    <line x1="42" y1="503" x2="332" y2="503" stroke="#3a5260" stroke-opacity="0.45" stroke-width="1"/>

    <text x="42" y="531" fill="#edf6f8" font-size="16" font-weight="700">{{D2_TITLE}}</text>
    <text x="42" y="550" fill="#9ab2c0" font-size="11">{{D2_MODEL}}</text>
    <text x="332" y="550" fill="#75c4dc" font-size="37" font-weight="700" text-anchor="end">{{D2_TEMP}}<tspan font-size="17">{{D2_UNIT}}</tspan></text>
    <rect x="42" y="564" width="290" height="5" rx="2.5" fill="#344b57"/>
    <rect x="42" y="564" width="{{D2_BAR}}" height="5" rx="2.5" fill="{{D2_BAR_COLOR}}"/>
    <text x="42" y="584" fill="#9ab2c0" font-size="11" font-weight="700">{{D2_USED}}</text>
    <text x="332" y="584" fill="#9ab2c0" font-size="11" text-anchor="end">{{D2_TOTAL}}</text>
    <line x1="42" y1="595" x2="332" y2="595" stroke="#3a5260" stroke-opacity="0.45" stroke-width="1"/>

    <text x="42" y="623" fill="#edf6f8" font-size="16" font-weight="700">{{D3_TITLE}}</text>
    <text x="42" y="642" fill="#9ab2c0" font-size="11">{{D3_MODEL}}</text>
    <text x="332" y="642" fill="#75c4dc" font-size="37" font-weight="700" text-anchor="end">{{D3_TEMP}}<tspan font-size="17">{{D3_UNIT}}</tspan></text>
    <rect x="42" y="656" width="290" height="5" rx="2.5" fill="#344b57"/>
    <rect x="42" y="656" width="{{D3_BAR}}" height="5" rx="2.5" fill="{{D3_BAR_COLOR}}"/>
    <text x="42" y="676" fill="#9ab2c0" font-size="11" font-weight="700">{{D3_USED}}</text>
    <text x="332" y="676" fill="#9ab2c0" font-size="11" text-anchor="end">{{D3_TOTAL}}</text>
    <line x1="42" y1="687" x2="332" y2="687" stroke="#3a5260" stroke-opacity="0.45" stroke-width="1"/>

    <text x="42" y="715" fill="#edf6f8" font-size="16" font-weight="700">{{D4_TITLE}}</text>
    <text x="42" y="734" fill="#9ab2c0" font-size="11">{{D4_MODEL}}</text>
    <text x="332" y="734" fill="#75c4dc" font-size="37" font-weight="700" text-anchor="end">{{D4_TEMP}}<tspan font-size="17">{{D4_UNIT}}</tspan></text>
    <rect x="42" y="748" width="290" height="5" rx="2.5" fill="#344b57"/>
    <rect x="42" y="748" width="{{D4_BAR}}" height="5" rx="2.5" fill="{{D4_BAR_COLOR}}"/>
    <text x="42" y="768" fill="#9ab2c0" font-size="11" font-weight="700">{{D4_USED}}</text>
    <text x="332" y="768" fill="#9ab2c0" font-size="11" text-anchor="end">{{D4_TOTAL}}</text>

    <!-- Virtual machines replace the former system overview -->
    <rect x="16" y="803" width="344" height="140" rx="7" fill="#15232e" stroke="#2a4050"/>
    <text x="32" y="833" fill="#edf6f8" font-size="16" font-weight="700">虚拟机状态</text>
    <text x="332" y="833" fill="#8fa6b4" font-size="11" text-anchor="end">{{VM_SUMMARY}}</text>
    <circle cx="45" cy="865.5" r="4" fill="#71d4b7"/>
    <text x="57" y="865.5" fill="#edf6f8" font-size="14" font-weight="600" dominant-baseline="middle">{{VM0_NAME}}</text>
    <text x="237" y="865.5" fill="#9ee8ce" font-size="12" dominant-baseline="middle">{{VM0_ID}}</text>
    <text x="332" y="865.5" fill="#9ee8ce" font-size="12" text-anchor="end" dominant-baseline="middle">{{VM0_STATUS}}</text>
    <line x1="42" y1="889" x2="332" y2="889" stroke="#3a5260" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="45" cy="912.5" r="4" fill="#71d4b7"/>
    <text x="57" y="912.5" fill="#edf6f8" font-size="14" font-weight="600" dominant-baseline="middle">{{VM1_NAME}}</text>
    <text x="237" y="912.5" fill="#9ee8ce" font-size="12" dominant-baseline="middle">{{VM1_ID}}</text>
    <text x="332" y="912.5" fill="#9ee8ce" font-size="12" text-anchor="end" dominant-baseline="middle">{{VM1_STATUS}}</text>
  </g>
</svg>
