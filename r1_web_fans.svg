<svg xmlns="http://www.w3.org/2000/svg" width="376" height="960" viewBox="0 0 376 960">
  <rect width="376" height="960" fill="#0b121b"/>
  <g font-family="PingFang SC, Noto Sans CJK SC, Arial, sans-serif">
    <text x="20" y="35" fill="#edf6f8" font-size="22" font-weight="700">HIKSEMI R1</text>
    <text x="20" y="61" fill="#8fa6b4" font-size="12">{{PVE_VERSION}}</text>
    <text x="20" y="81" fill="#75c4dc" font-size="11">{{UPTIME}}</text>
    <rect x="291" y="13" width="65" height="25" rx="6" fill="#17382f" stroke="#327861" stroke-width="1"/>
    <circle cx="304" cy="25.5" r="4" fill="#71d4b7"/>
    <text x="316" y="30" fill="#9ee8ce" font-size="12" font-weight="600">在线</text>
    <text x="356" y="80" fill="#edf6f8" font-size="37" font-weight="700" text-anchor="end">{{CLOCK}}</text>

    <rect x="16" y="99" width="344" height="197" rx="7" fill="#15232e" stroke="#2a4050"/>
    <text x="32" y="127" fill="#edf6f8" font-size="16" font-weight="700">机箱风扇</text>
    <text x="344" y="126" fill="#9bb1be" font-size="12" text-anchor="end">SYS FAN · FAN 2</text>
    <circle cx="94" cy="209" r="58" fill="none" stroke="#263845" stroke-width="11"/>
    <circle cx="94" cy="209" r="58" fill="none" stroke="{{F2_ARC_COLOR}}" stroke-width="11" stroke-linecap="round" stroke-dasharray="{{F2_ARC}} 364" transform="rotate(-90 94 209)"/>
    <text x="94" y="213" fill="{{F2_OUTPUT_COLOR}}" font-size="32" font-weight="700" text-anchor="middle">{{F2_OUTPUT}}</text>
    <text x="94" y="238" fill="#9bb1be" font-size="12" text-anchor="middle">PWM 输出</text>
    <text x="171" y="202" fill="#9bb1be" font-size="13" dominant-baseline="middle">转速</text>
    <text x="329" y="174" fill="#9bb1be" font-size="11" text-anchor="end">{{F2_RPM_UNIT}}</text>
    <text x="329" y="213" fill="{{F2_RPM_COLOR}}" font-size="{{F2_RPM_FONT}}" font-weight="700" text-anchor="end">{{F2_RPM}}</text>
    <line x1="158" y1="227" x2="344" y2="227" stroke="#3a5260" stroke-opacity="0.45" stroke-width="1"/>
    <text x="171" y="249" fill="#9bb1be" font-size="13" dominant-baseline="middle">状态</text>
    <text x="329" y="257" fill="{{F2_STATUS_COLOR}}" font-size="17" text-anchor="end">{{F2_STATUS}}</text>

    <rect x="16" y="310" width="344" height="197" rx="7" fill="#15232e" stroke="#2a4050"/>
    <text x="32" y="338" fill="#edf6f8" font-size="16" font-weight="700">CPU 散热风扇</text>
    <text x="344" y="337" fill="#9bb1be" font-size="12" text-anchor="end">CPU FAN · FAN 3</text>
    <circle cx="94" cy="420" r="58" fill="none" stroke="#263845" stroke-width="11"/>
    <circle cx="94" cy="420" r="58" fill="none" stroke="{{F3_ARC_COLOR}}" stroke-width="11" stroke-linecap="round" stroke-dasharray="{{F3_ARC}} 364" transform="rotate(-90 94 420)"/>
    <text x="94" y="424" fill="{{F3_OUTPUT_COLOR}}" font-size="32" font-weight="700" text-anchor="middle">{{F3_OUTPUT}}</text>
    <text x="94" y="449" fill="#9bb1be" font-size="12" text-anchor="middle">PWM 输出</text>
    <text x="171" y="413" fill="#9bb1be" font-size="13" dominant-baseline="middle">转速</text>
    <text x="329" y="385" fill="#9bb1be" font-size="11" text-anchor="end">{{F3_RPM_UNIT}}</text>
    <text x="329" y="424" fill="{{F3_RPM_COLOR}}" font-size="{{F3_RPM_FONT}}" font-weight="700" text-anchor="end">{{F3_RPM}}</text>
    <line x1="158" y1="438" x2="344" y2="438" stroke="#3a5260" stroke-opacity="0.45" stroke-width="1"/>
    <text x="171" y="460" fill="#9bb1be" font-size="13" dominant-baseline="middle">状态</text>
    <text x="329" y="468" fill="{{F3_STATUS_COLOR}}" font-size="17" text-anchor="end">{{F3_STATUS}}</text>

    <rect x="16" y="521" width="344" height="134" rx="7" fill="#15232e" stroke="#2a4050"/>
    <text x="32" y="547" fill="#edf6f8" font-size="16" font-weight="700">温控依据</text>
    <text x="344" y="546" fill="#9bb1be" font-size="11" text-anchor="end">独立温控读数</text>
    <text x="32" y="580" fill="#9bb1be" font-size="13" dominant-baseline="middle">CPU 最高温度</text>
    <text x="344" y="588" fill="{{BASIS_CPU_COLOR}}" font-size="26" font-weight="700" text-anchor="end">{{BASIS_CPU_TEMP}}</text>
    <line x1="32" y1="597" x2="344" y2="597" stroke="#3a5260" stroke-opacity="0.45" stroke-width="1"/>
    <text x="32" y="622" fill="#9bb1be" font-size="13" dominant-baseline="middle">BAY 1–4 最高</text>
    <text x="344" y="630" fill="{{BASIS_DRIVE_COLOR}}" font-size="26" font-weight="700" text-anchor="end">{{BASIS_DRIVE_TEMP}}</text>

    <rect x="16" y="665" width="344" height="134" rx="7" fill="#15232e" stroke="#2a4050"/>
    <text x="32" y="691" fill="#edf6f8" font-size="16" font-weight="700">风扇控制</text>
    <text x="344" y="690" fill="#9bb1be" font-size="12" text-anchor="end">独立温控服务</text>
    <text x="32" y="723" fill="{{CONTROL_COLOR}}" font-size="19" font-weight="700">{{CONTROL_STATUS}}</text>
    <text x="344" y="723" fill="#9bb1be" font-size="12" text-anchor="end">{{CONTROL_MODE}}</text>
    <rect x="32" y="738" width="148" height="45" rx="5" fill="{{FULL_BUTTON_BG}}"/>
    <text x="106" y="766" fill="{{FULL_BUTTON_FG}}" font-size="14" font-weight="700" text-anchor="middle">全速 1 分钟</text>
    <rect x="196" y="738" width="148" height="45" rx="5" fill="{{AUTO_BUTTON_BG}}"/>
    <text x="270" y="766" fill="{{AUTO_BUTTON_FG}}" font-size="14" font-weight="700" text-anchor="middle">自动曲线</text>

    <rect x="16" y="809" width="344" height="134" rx="7" fill="#15232e" stroke="#2a4050"/>
    <text x="32" y="835" fill="#edf6f8" font-size="16" font-weight="700">R1 RGB 灯光</text>
    <text x="32" y="867" fill="{{RGB_COLOR}}" font-size="19" font-weight="700">{{RGB_STATUS}}</text>
    <rect x="32" y="882" width="148" height="45" rx="5" fill="{{RGB_ON_BUTTON_BG}}"/>
    <text x="106" y="910" fill="{{RGB_ON_BUTTON_FG}}" font-size="15" font-weight="700" text-anchor="middle">打开灯光</text>
    <rect x="196" y="882" width="148" height="45" rx="5" fill="{{RGB_OFF_BUTTON_BG}}"/>
    <text x="270" y="910" fill="{{RGB_OFF_BUTTON_FG}}" font-size="15" font-weight="700" text-anchor="middle">关闭灯光</text>
  </g>
</svg>
